name: HackerOne Scraper
on:
  workflow_dispatch:
  schedule:
    # Fires every 15 min. Runs are long (hours), so an event always lands while
    # one is in progress; the concurrency guard below keeps exactly one run
    # queued, and it starts the instant the current run finishes -> back-to-back
    # scraping with no token. Extra events that fire mid-run are harmlessly
    # dropped by the concurrency group.
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: h1-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r h1/requirements.txt
      - name: Run scraper
        id: scrape
        # Hard backstop, kept under the 6h (360 min) GitHub-hosted cap so the
        # export + commit steps still get to run.
        timeout-minutes: 350
        run: |
          # GNU timeout sends SIGINT at the time budget; the script catches it,
          # finishes the current id, commits, and exits gracefully.
          code=0
          timeout --signal=SIGINT 320m \
            python h1/main.py --db h1/reports.db --csv h1/reports.csv || code=$?
          # 0   = reached the end of the range (whole sweep done)
          # 124 = hit the time budget (normal for a long, resumable sweep)
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Scraper finished or hit the time budget cleanly (code=$code)."
            exit 0
          fi
          echo "Scraper failed with a real error (code=$code)."
          exit "$code"
      - name: Export CSV from DB
        # Runs even if the scraper errored, so the CSV always reflects the DB.
        if: always()
        run: python h1/main.py --db h1/reports.db --csv h1/reports.csv --export-only
      - name: Commit changes
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add h1/reports.db h1/reports.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update HackerOne reports ($(date -u +%Y-%m-%d))"
          # DB/CSV are rewritten wholesale each run; if the remote moved, keep ours.
          git pull --rebase -X ours
          git push
      # Note: continuous chaining is driven by the schedule + concurrency above,
      # not by self-triggering. The default GITHUB_TOKEN cannot dispatch another
      # workflow run (GitHub blocks it to prevent recursion), so no token is
      # needed here at all.
