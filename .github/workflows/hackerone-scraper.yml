name: HackerOne Scraper
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # daily safety net in case the self-chain ever breaks
permissions:
  contents: write
concurrency:
  group: h1-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r h1/requirements.txt
      - name: Run scraper
        id: scrape
        # Hard backstop, kept under the 6h (360 min) GitHub-hosted cap so the
        # export + commit steps still get to run.
        timeout-minutes: 350
        run: |
          # GNU timeout sends SIGINT at the time budget; the script catches it,
          # finishes the current id, commits, and exits gracefully.
          code=0
          timeout --signal=SIGINT 320m \
            python h1/main.py --db h1/reports.db --csv h1/reports.csv || code=$?
          # 0   = reached the end of the range (whole sweep done)
          # 124 = hit the time budget (normal for a long, resumable sweep)
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Scraper finished or hit the time budget cleanly (code=$code)."
            exit 0
          fi
          echo "Scraper failed with a real error (code=$code)."
          exit "$code"
      - name: Export CSV from DB
        # Runs even if the scraper errored, so the CSV always reflects the DB.
        if: always()
        run: python h1/main.py --db h1/reports.db --csv h1/reports.csv --export-only
      - name: Commit changes
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add h1/reports.db h1/reports.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update HackerOne reports ($(date -u +%Y-%m-%d))"
          # DB/CSV are rewritten wholesale each run; if the remote moved, keep ours.
          git pull --rebase -X ours
          git push
      # Kick off the next run as soon as this one finishes, so scraping runs
      # continuously back-to-back. Uses a PAT because the default GITHUB_TOKEN
      # cannot trigger another workflow run. Runs even on failure so the chain
      # never stalls; concurrency (above) makes the queued run wait until this
      # job fully completes.
      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT }}
        run: gh workflow run "HackerOne Scraper" --ref main
